name: release

# Publishes a version tag: the WASM package to npm, CLI binaries for every
# target, and the GitHub Release with notes from the CHANGELOG.md section. The
# release is created only after every publish succeeded, so a release page
# never points at a package that isn't there.
#
# Tags come from prepare-release.yml. A hand-pushed `vX.Y.Z` tag works too,
# as long as the manifests and changelog already carry that version.
#
# On a fork: set the repository variable `PUBLISH_NPM` to `false` and a tag
# gets you binaries and a GitHub Release without the npm publish, which a
# fork cannot do. prepare-release.yml needs more than that — a GitHub App in
# `RELEASE_APP_ID` / `RELEASE_APP_KEY` — so bump the manifests and the
# changelog by hand there and push the tag yourself.
#
# npm trusted publishing is bound to this filename.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches every manifest
        id: v
        run: |
          set -eu
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "::error::run this on a version tag, got $GITHUB_REF"; exit 1 ;; esac
          tag="${GITHUB_REF_NAME#v}"
          cargo="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          cli="$(grep -m1 '^version = ' cli/Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          npm="$(node -p "require('./package.json').version")"
          echo "tag=$tag Cargo.toml=$cargo cli/Cargo.toml=$cli package.json=$npm"
          for v in "$cargo" "$cli" "$npm"; do
            [ "$tag" = "$v" ] || { echo "::error::tag $tag does not match every manifest"; exit 1; }
          done
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: Changelog has this version
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md && cat notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  # No crates.io job. `share_s3` depends on two `publish = false` crates, so
  # `cargo publish -p txcript` cannot succeed — and this fork does not own the
  # `txcript` name on crates.io in any case. Restoring it means restoring the
  # dry-run gates in ci.yml and prepare-release.yml at the same time, or the
  # break lands after the tag is pushed and after npm has published.

  # Trusted publishing is bound to this repository *and* this workflow
  # filename on npmjs, and a fork does not own the `txcript` name, so the job
  # can only fail there. Set the repository variable `PUBLISH_NPM` to `false`
  # on a fork to skip it; unset means publish, so nothing changes upstream.
  npm:
    name: Publish to npm
    if: vars.PUBLISH_NPM != 'false'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      # The link the release notes get, from the manifest that was actually
      # published rather than from a name written down twice.
      url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.126
      # The build script runs through Bun; npm still invokes the prepare
      # lifecycle during publish, so Bun must be on PATH.
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 24 can bundle older.
      - run: npm install -g npm@latest
      - run: bun run build
      - id: publish
        run: |
          set -eu
          npm publish --access public --ignore-scripts
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "url=https://www.npmjs.com/package/$name/v/$version" >> "$GITHUB_OUTPUT"

  binaries:
    name: Build CLI binaries
    needs: verify
    uses: ./.github/workflows/build-binaries.yml

  github-release:
    name: Create GitHub Release
    needs: [verify, npm, binaries]
    # A release page must never point at a package that is not there, so a
    # *failed* npm publish still blocks this. A *skipped* one does not: a
    # fork that has opted out of npm has nothing to be out of step with, and
    # would otherwise get no release at all. `always()` is what lets the job
    # run with a skipped dependency; the rest restores the gating it removes.
    if: >-
      always()
      && needs.verify.result == 'success'
      && needs.binaries.result == 'success'
      && needs.npm.result != 'failure'
      && needs.npm.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release with notes and binaries
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_URL: ${{ needs.npm.outputs.url }}
        run: |
          set -eu
          ls -R artifacts
          # One link per package this run actually published. A fork that
          # skips npm says nothing rather than pointing at a package it does
          # not own, and there is no crates.io link because there is no
          # crates.io job.
          if [ -n "$NPM_URL" ]; then
            printf '\n---\n\n- npm: %s\n' "$NPM_URL" >> artifacts/release-notes/notes.md
          fi
          cat artifacts/release-notes/notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file artifacts/release-notes/notes.md \
            artifacts/txcript-*/txcript-*
